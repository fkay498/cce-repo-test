apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo              # put it in the demo folder
  labels:
    app: demo-api
spec:
  # No "replicas:" here on purpose: the HPA (k8s/hpa.yaml) decides how many
  # copies run (1 to 3). If this file set a number, every deploy would reset it.
  revisionHistoryLimit: 3      # remember 3 old versions so we can roll back
  selector:
    matchLabels:
      app: demo-api            # "I manage the pods that have this label"
  strategy:
    type: RollingUpdate        # zero downtime: start the new pod, THEN stop the old one
    rollingUpdate:
      # The cluster must have room for TWO copies during a deploy
      # (2 x 384Mi memory requested), otherwise the new pod stays Pending.
      maxSurge: 1              # allow 1 extra pod during an update
      maxUnavailable: 0        # never stop the old pod before the new one is ready
  minReadySeconds: 5           # new pod must stay ready 5s before the old one is stopped
  template:                    # the blueprint for each pod
    metadata:
      labels:
        app: demo-api          # this label is how the Service finds the pod
    spec:
      imagePullSecrets:
        - name: default-secret # the password the node uses to download from SWR
      terminationGracePeriodSeconds: 40   # 10s preStop + 20s Spring shutdown + margin
      containers:
        - name: demo-api
          image: __IMAGE__     # PLACEHOLDER. The command in Step C fills it in.
          imagePullPolicy: Always
          lifecycle:
            preStop:           # when the old pod is told to stop, wait 10s first so the
              exec:            # ELB and Service stop sending it traffic, THEN Spring Boot
                command: ["sleep", "10"]   # shuts down gracefully (20s).
          ports:
            - containerPort: 8080   # the port our Spring Boot app listens on
              name: http
          resources:
            requests:          # what the pod is guaranteed
              cpu: 250m        # a quarter of a CPU core
              memory: 384Mi
            limits:            # the most it may use
              cpu: 500m
              memory: 512Mi
          startupProbe:        # waits for the app to finish starting (up to 150 seconds)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:      # decides whether the pod receives traffic
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:       # restarts the container if it hangs
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
