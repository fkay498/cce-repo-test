# Second sample app. It shares the same ELB as demo-api through the Ingress
# in ingress.yaml: http://<ELB>/app2/... comes here, everything else goes to demo-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: demo
  labels:
    app: app2
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app2
  strategy:
    type: RollingUpdate        # zero downtime: new pod first, then stop the old one
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app2
    spec:
      imagePullSecrets:
        - name: default-secret # SWR pull secret that CCE creates in each namespace
      containers:
        - name: app2
          image: __IMAGE_APP2__  # PLACEHOLDER. The workflow fills it in.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:            # tiny: nginx needs very little
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /app2/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /app2/health
              port: http
            periodSeconds: 20
---
# Internal Service for app2. No ELB of its own: the Ingress reaches it.
# NodePort is what CCE's ELB Ingress uses on VPC / tunnel network clusters.
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: demo
spec:
  type: NodePort
  selector:
    app: app2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
