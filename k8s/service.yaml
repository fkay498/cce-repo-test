apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo
spec:
  # Internal Service. It no longer owns the ELB itself: the Ingress in
  # ingress.yaml owns the ELB's port-80 listener and sends traffic here,
  # so the same ELB can serve several apps (see app2.yaml).
  # NodePort is what CCE's ELB Ingress uses on VPC / tunnel network clusters.
  type: NodePort
  selector:
    app: demo-api         # send traffic to pods with this label
  ports:
    - name: http
      port: 80            # the port the Ingress uses
      targetPort: 8080    # the port on the pod
      protocol: TCP
