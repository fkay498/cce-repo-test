# All of app3 lives under /app3, because the Ingress sends /app3/... here.
server {
    listen 8080;

    # Health check used by Kubernetes (startup/readiness/liveness probes)
    location = /app3/health {
        default_type application/json;
        return 200 '{"app":"app3","status":"UP"}\n';
    }

    # Any other /app3 URL: say hello and show which pod answered
    location /app3 {
        default_type application/json;
        return 200 '{"app":"app3","message":"Hello from the third app (temporary)","pod":"$hostname","path":"$request_uri"}\n';
    }

    location / {
        return 404;
    }
}
