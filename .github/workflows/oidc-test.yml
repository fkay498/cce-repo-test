name: oidc-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange token
        env:
          HW_IAM_ENDPOINT: ${{ vars.HW_IAM_ENDPOINT }}
          HW_IDP_ID: ${{ vars.HW_IDP_ID }}
          HW_PROJECT_ID: ${{ vars.HW_PROJECT_ID }}
          HW_OIDC_AUDIENCE: ${{ vars.HW_OIDC_AUDIENCE }}
        run: |
          set -uo pipefail
          # 0. Make sure every variable has a value
          missing=0
          for v in HW_IAM_ENDPOINT HW_IDP_ID HW_PROJECT_ID HW_OIDC_AUDIENCE; do
            if [ -z "${!v}" ]; then echo "MISSING VARIABLE: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Add the missing variables under Settings > Secrets and variables > Actions > Variables"; exit 1; }
          echo "Endpoint: ${HW_IAM_ENDPOINT}"
          echo "Identity provider: ${HW_IDP_ID}"

          # 1. Ask GitHub for the signed token
          JWT=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${HW_OIDC_AUDIENCE}" | jq -r .value)
          echo "::add-mask::$JWT"

          # 2. Send it to Huawei IAM
          curl -sS -D /tmp/headers.txt -o /tmp/body.json -X POST \
            "https://${HW_IAM_ENDPOINT}/v3.0/OS-AUTH/id-token/tokens" \
            -H "Content-Type: application/json;charset=utf8" -H "X-Idp-Id: ${HW_IDP_ID}" \
            -d "$(jq -n --arg jwt "$JWT" --arg pid "$HW_PROJECT_ID" '{auth:{id_token:{id:$jwt},scope:{project:{id:$pid}}}}')"
          echo "curl exit code: $?"

          echo "--- status line ---"
          head -n 1 /tmp/headers.txt 2>/dev/null || echo "(no response received)"
          echo "--- token header present? ---"
          if grep -qi '^x-subject-token:' /tmp/headers.txt 2>/dev/null; then echo "YES, a Huawei token was issued"; else echo "NO token"; fi
          echo "--- response body (first 500 characters, token hidden) ---"
          if [ -f /tmp/body.json ]; then head -c 500 /tmp/body.json | sed -E 's/"token".*/"token": <hidden>/'; echo; else echo "(no body)"; fi
