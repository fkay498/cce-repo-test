name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HW_REGION: ${{ vars.HW_REGION }}
  HW_PROJECT_ID: ${{ vars.HW_PROJECT_ID }}
  HW_ACCOUNT_ID: ${{ vars.HW_ACCOUNT_ID }}
  HW_AGENCY_NAME: ${{ vars.HW_AGENCY_NAME }}
  HW_PROVIDER_NAME: ${{ vars.HW_PROVIDER_NAME }}
  HW_OIDC_AUDIENCE: ${{ vars.HW_OIDC_AUDIENCE }}
  HW_CLUSTER_ID: ${{ vars.HW_CLUSTER_ID }}
  HW_ELB_ID: ${{ vars.HW_ELB_ID }}
  SWR_ORG: ${{ vars.SWR_ORG }}
  K8S_NAMESPACE: demo
  APP_NAME: demo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Stage 1: OIDC login ----
      - name: Log in to Huawei Cloud (OIDC trust agency)
        run: |
          set -euo pipefail
          for v in HW_ACCOUNT_ID HW_AGENCY_NAME HW_PROVIDER_NAME HW_OIDC_AUDIENCE HW_REGION; do
            [ -n "${!v}" ] || { echo "MISSING VARIABLE: $v"; exit 1; }
          done

          ID_TOKEN=$(curl -sS --fail-with-body --retry 3 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${HW_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value // empty')
          [ -n "$ID_TOKEN" ] || { echo "No OIDC token from GitHub"; exit 1; }
          echo "::add-mask::${ID_TOKEN}"

          SUB=$(cut -d. -f2 <<<"$ID_TOKEN" | tr '_-' '/+' \
            | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
            | base64 -d 2>/dev/null | jq -r '.sub // empty' 2>/dev/null || true)
          echo "This run's token subject (sub): ${SUB}"

          BODY=$(jq -n \
            --arg agency   "iam::${HW_ACCOUNT_ID}:agency:${HW_AGENCY_NAME}" \
            --arg provider "iam::${HW_ACCOUNT_ID}:oidcProvider:${HW_PROVIDER_NAME}" \
            --arg session  "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg token    "$ID_TOKEN" \
            '{agency_urn:$agency, provider_urn:$provider, agency_session_name:$session, id_token:$token, duration_seconds:3600}')
          RESP=$(curl -sS --retry 3 -X POST \
            "https://sts.${HW_REGION}.myhuaweicloud.com/v5/agencies/assume-with-oidc" \
            -H "Content-Type: application/json" -d "$BODY")

          AK=$(jq -r '.credentials.access_key_id // empty'     <<<"$RESP" 2>/dev/null || true)
          SK=$(jq -r '.credentials.secret_access_key // empty' <<<"$RESP" 2>/dev/null || true)
          ST=$(jq -r '.credentials.security_token // empty'    <<<"$RESP" 2>/dev/null || true)
          if [ -z "$AK" ] || [ -z "$SK" ] || [ -z "$ST" ]; then
            echo "STS did not return credentials. Response:"; echo "$RESP"; exit 1
          fi
          echo "::add-mask::${AK}"; echo "::add-mask::${SK}"; echo "::add-mask::${ST}"
          { echo "HW_ACCESS_KEY=${AK}"; echo "HW_SECRET_KEY=${SK}"; echo "HW_SECURITY_TOKEN=${ST}"; } >> "$GITHUB_ENV"
          echo "Logged in as agency ${HW_AGENCY_NAME}"

      # ---- Stage 2: build and test ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build Docker image (linux/amd64)
        run: |
          IMAGE="swr.${HW_REGION}.myhuaweicloud.com/${SWR_ORG}/${APP_NAME}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .

      # ---- Stage 3: push to SWR ----
      # The temporary AK/SK from OIDC cannot be used directly as a docker password
      # (HMAC login and SK#token both give "Authenticate Error"), and the old
      # CreateSecret API rejects agency sessions with SWR.4002047 "Have NOT set akey/skey".
      # The newer CreateAuthorizationToken API issues a short-lived "bearertoken@..."
      # docker login, signed here with the temporary AK/SK + security token.
      # The agency needs: swr::createAuthorizationToken, sts::createServiceBearerToken,
      # and push rights on the SWR organization.
      - name: Install Huawei Cloud SWR SDK
        run: |
          python3 -m venv /tmp/hwsdk
          /tmp/hwsdk/bin/pip install --quiet --upgrade huaweicloudsdkcore huaweicloudsdkswr

      - name: Log in to SWR (temporary bearer token) and push images
        run: |
          set -euo pipefail
          SWR_HOST="swr.${HW_REGION}.myhuaweicloud.com"
          AUTH=$(/tmp/hwsdk/bin/python - <<'PY'
          import base64, os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkcore.exceptions import exceptions
          from huaweicloudsdkswr.v2 import SwrClient, CreateAuthorizationTokenRequest

          region = os.environ["HW_REGION"]
          cred = (BasicCredentials(os.environ["HW_ACCESS_KEY"], os.environ["HW_SECRET_KEY"],
                                   os.environ["HW_PROJECT_ID"])
                  .with_security_token(os.environ["HW_SECURITY_TOKEN"]))
          client = (SwrClient.new_builder()
                    .with_credentials(cred)
                    .with_endpoints([f"https://swr-api.{region}.myhuaweicloud.com"])
                    .build())
          try:
              resp = client.create_authorization_token(CreateAuthorizationTokenRequest())
          except exceptions.ClientRequestException as e:
              print(f"SWR CreateAuthorizationToken failed: {e.status_code} {e.error_code} {e.error_msg}",
                    file=sys.stderr)
              sys.exit(1)

          # Preferred: body {"auths": {"<host>": {"auth": base64("user:password")}}}
          auths = (resp.to_dict() or {}).get("auths") or {}
          for info in auths.values():
              if info and info.get("auth"):
                  print(info["auth"]); sys.exit(0)

          # Fallback: X-Swr-Dockerlogin header "docker login -u USER -p PASS [host]"
          cmd = getattr(resp, "x_swr_dockerlogin", None) or ""
          parts = cmd.split()
          if "-u" in parts and "-p" in parts:
              user = parts[parts.index("-u") + 1]; pwd = parts[parts.index("-p") + 1]
              print(base64.b64encode(f"{user}:{pwd}".encode()).decode()); sys.exit(0)

          print("SWR returned no login credentials", file=sys.stderr); sys.exit(1)
          PY
          )
          echo "::add-mask::${AUTH}"
          CRED=$(printf '%s' "$AUTH" | base64 -d)
          SWR_USER="${CRED%%:*}"; SWR_PASS="${CRED#*:}"
          echo "::add-mask::${SWR_PASS}"
          echo "SWR login user type: ${SWR_USER%%@*}"
          printf '%s' "${SWR_PASS}" | docker login -u "${SWR_USER}" --password-stdin "${SWR_HOST}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # ---- Stage 4 (not added yet): deploy to CCE ----