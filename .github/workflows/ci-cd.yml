name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HW_REGION: ${{ vars.HW_REGION }}
  HW_PROJECT_ID: ${{ vars.HW_PROJECT_ID }}
  HW_IAM_ENDPOINT: ${{ vars.HW_IAM_ENDPOINT }}
  HW_IDP_ID: ${{ vars.HW_IDP_ID }}
  HW_OIDC_AUDIENCE: ${{ vars.HW_OIDC_AUDIENCE }}
  HW_CLUSTER_ID: ${{ vars.HW_CLUSTER_ID }}
  HW_ELB_ID: ${{ vars.HW_ELB_ID }}
  SWR_ORG: ${{ vars.SWR_ORG }}
  K8S_NAMESPACE: demo
  APP_NAME: demo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build Docker image (linux/amd64)
        run: |
          IMAGE="swr.${HW_REGION}.myhuaweicloud.com/${SWR_ORG}/${APP_NAME}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .

      - name: Authenticate to Huawei Cloud with GitHub OIDC
        run: |
          set -euo pipefail
          JWT=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${HW_OIDC_AUDIENCE}" | jq -r .value)
          echo "::add-mask::${JWT}"
          HDRS=$(mktemp); BODY=$(mktemp)
          CODE=$(curl -sS -D "$HDRS" -o "$BODY" -w '%{http_code}' -X POST \
            "https://${HW_IAM_ENDPOINT}/v3.0/OS-AUTH/id-token/tokens" \
            -H "Content-Type: application/json;charset=utf8" \
            -H "X-Idp-Id: ${HW_IDP_ID}" \
            -d "$(jq -n --arg jwt "$JWT" --arg pid "$HW_PROJECT_ID" \
                  '{auth:{id_token:{id:$jwt},scope:{project:{id:$pid}}}}')")
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "IAM token exchange failed with HTTP $CODE"; cat "$BODY"; exit 1
          fi
          HW_TOKEN=$(grep -i '^x-subject-token:' "$HDRS" | awk '{print $2}' | tr -d '\r')
          [ -n "$HW_TOKEN" ] || { echo "No token in response"; exit 1; }
          echo "::add-mask::${HW_TOKEN}"
          echo "HW_TOKEN=${HW_TOKEN}" >> "$GITHUB_ENV"
      - name: Diagnose SWR permissions
        run: |
          set +e
          echo "--- list SWR organizations with the token ---"
          curl -sS -o /tmp/ns.json -w 'HTTP %{http_code}\n' \
            "https://swr-api.${HW_REGION}.myhuaweicloud.com/v2/manage/namespaces" \
            -H "X-Auth-Token: ${HW_TOKEN}" -H "Content-Type: application/json"
          head -c 500 /tmp/ns.json; echo
          true

      - name: Log in to SWR and push images
        run: |
          set -euo pipefail
          RESP=$(curl -sSf -X POST \
            "https://swr-api.${HW_REGION}.myhuaweicloud.com/v2/manage/utils/secret?projectname=${HW_REGION}" \
            -H "X-Auth-Token: ${HW_TOKEN}" -H "Content-Type: application/json")
          CRED=$(echo "$RESP" | jq -r '.auths | to_entries[0].value.auth' | base64 -d)
          SWR_USER="${CRED%%:*}"; SWR_PASS="${CRED#*:}"
          echo "::add-mask::${SWR_PASS}"
          echo "${SWR_PASS}" | docker login -u "${SWR_USER}" --password-stdin "swr.${HW_REGION}.myhuaweicloud.com"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Get short-lived kubeconfig from CCE
        run: |
          set -euo pipefail
          KCFG="${RUNNER_TEMP}/kubeconfig"
          curl -sSf -X POST \
            "https://cce.${HW_REGION}.myhuaweicloud.com/api/v3/projects/${HW_PROJECT_ID}/clusters/${HW_CLUSTER_ID}/clustercert" \
            -H "X-Auth-Token: ${HW_TOKEN}" -H "Content-Type: application/json" \
            -d '{"duration":1}' > "$KCFG"
          chmod 600 "$KCFG"
          echo "KUBECONFIG=${KCFG}" >> "$GITHUB_ENV"
          export KUBECONFIG="$KCFG"
          kubectl config use-context externalTLSVerify || kubectl config use-context external
          kubectl -n "${K8S_NAMESPACE}" get pods

      - name: Deploy to CCE
        run: |
          set -euo pipefail
          for f in k8s/deployment.yaml k8s/service.yaml; do
            sed -e "s|__IMAGE__|${IMAGE}:${GITHUB_SHA}|g" \
                -e "s|__ELB_ID__|${HW_ELB_ID}|g" "$f" \
              | kubectl apply -n "${K8S_NAMESPACE}" -f -
          done
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${APP_NAME}" --timeout=300s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "${K8S_NAMESPACE}" get pods,svc,endpoints -o wide || true
          kubectl -n "${K8S_NAMESPACE}" describe deployment "${APP_NAME}" || true
          kubectl -n "${K8S_NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 30 || true
