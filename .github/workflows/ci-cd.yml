name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  HW_REGION: ${{ vars.HW_REGION }}
  HW_PROJECT_ID: ${{ vars.HW_PROJECT_ID }}
  HW_ACCOUNT_ID: ${{ vars.HW_ACCOUNT_ID }}
  HW_AGENCY_NAME: ${{ vars.HW_AGENCY_NAME }}
  HW_PROVIDER_NAME: ${{ vars.HW_PROVIDER_NAME }}
  HW_OIDC_AUDIENCE: ${{ vars.HW_OIDC_AUDIENCE }}
  HW_CLUSTER_ID: ${{ vars.HW_CLUSTER_ID }}
  HW_ELB_ID: ${{ vars.HW_ELB_ID }}
  SWR_ORG: ${{ vars.SWR_ORG }}
  K8S_NAMESPACE: demo
  APP_NAME: demo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- Stage 1: OIDC login ----
      - name: Log in to Huawei Cloud (OIDC trust agency)
        run: |
          set -euo pipefail
          for v in HW_ACCOUNT_ID HW_AGENCY_NAME HW_PROVIDER_NAME HW_OIDC_AUDIENCE HW_REGION; do
            [ -n "${!v}" ] || { echo "MISSING VARIABLE: $v"; exit 1; }
          done

          ID_TOKEN=$(curl -sS --fail-with-body --retry 3 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${HW_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value // empty')
          [ -n "$ID_TOKEN" ] || { echo "No OIDC token from GitHub"; exit 1; }
          echo "::add-mask::${ID_TOKEN}"

          SUB=$(cut -d. -f2 <<<"$ID_TOKEN" | tr '_-' '/+' \
            | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
            | base64 -d 2>/dev/null | jq -r '.sub // empty' 2>/dev/null || true)
          echo "This run's token subject (sub): ${SUB}"

          BODY=$(jq -n \
            --arg agency   "iam::${HW_ACCOUNT_ID}:agency:${HW_AGENCY_NAME}" \
            --arg provider "iam::${HW_ACCOUNT_ID}:oidcProvider:${HW_PROVIDER_NAME}" \
            --arg session  "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg token    "$ID_TOKEN" \
            '{agency_urn:$agency, provider_urn:$provider, agency_session_name:$session, id_token:$token, duration_seconds:3600}')
          RESP=$(curl -sS --retry 3 -X POST \
            "https://sts.${HW_REGION}.myhuaweicloud.com/v5/agencies/assume-with-oidc" \
            -H "Content-Type: application/json" -d "$BODY")

          AK=$(jq -r '.credentials.access_key_id // empty'     <<<"$RESP" 2>/dev/null || true)
          SK=$(jq -r '.credentials.secret_access_key // empty' <<<"$RESP" 2>/dev/null || true)
          ST=$(jq -r '.credentials.security_token // empty'    <<<"$RESP" 2>/dev/null || true)
          if [ -z "$AK" ] || [ -z "$SK" ] || [ -z "$ST" ]; then
            echo "STS did not return credentials. Response:"; echo "$RESP"; exit 1
          fi
          echo "::add-mask::${AK}"; echo "::add-mask::${SK}"; echo "::add-mask::${ST}"
          { echo "HW_ACCESS_KEY=${AK}"; echo "HW_SECRET_KEY=${SK}"; echo "HW_SECURITY_TOKEN=${ST}"; } >> "$GITHUB_ENV"
          echo "Logged in as agency ${HW_AGENCY_NAME}"

      # ---- Stage 2: build and test ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build Docker images (linux/amd64)
        run: |
          IMAGE="swr.${HW_REGION}.myhuaweicloud.com/${SWR_ORG}/${APP_NAME}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .

          # Second sample app (app2/): shares the same ELB through the Ingress
          IMAGE_APP2="swr.${HW_REGION}.myhuaweicloud.com/${SWR_ORG}/app2"
          echo "IMAGE_APP2=${IMAGE_APP2}" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            -t "${IMAGE_APP2}:${GITHUB_SHA}" -t "${IMAGE_APP2}:latest" app2

      # ---- Stage 3: push to SWR ----
      # The temporary AK/SK from OIDC cannot be used directly as a docker password
      # (HMAC login and SK#token both give "Authenticate Error"), and the old
      # CreateSecret API rejects agency sessions with SWR.4002047 "Have NOT set akey/skey".
      # The newer CreateAuthorizationToken API issues a short-lived "bearertoken@..."
      # docker login, signed here with the temporary AK/SK + security token.
      # The agency needs: swr::createAuthorizationToken, sts::createServiceBearerToken,
      # and push rights on the SWR organization.
      - name: Install Huawei Cloud SDK (SWR + CCE)
        run: |
          python3 -m venv /tmp/hwsdk
          /tmp/hwsdk/bin/pip install --quiet --upgrade huaweicloudsdkcore huaweicloudsdkswr huaweicloudsdkcce huaweicloudsdkelb

      - name: Log in to SWR (temporary bearer token) and push images
        run: |
          set -euo pipefail
          SWR_HOST="swr.${HW_REGION}.myhuaweicloud.com"
          AUTH=$(/tmp/hwsdk/bin/python - <<'PY'
          import base64, os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkcore.exceptions import exceptions
          from huaweicloudsdkswr.v2 import SwrClient, CreateAuthorizationTokenRequest

          region = os.environ["HW_REGION"]
          cred = (BasicCredentials(os.environ["HW_ACCESS_KEY"], os.environ["HW_SECRET_KEY"],
                                   os.environ["HW_PROJECT_ID"])
                  .with_security_token(os.environ["HW_SECURITY_TOKEN"]))
          client = (SwrClient.new_builder()
                    .with_credentials(cred)
                    .with_endpoints([f"https://swr-api.{region}.myhuaweicloud.com"])
                    .build())
          try:
              resp = client.create_authorization_token(CreateAuthorizationTokenRequest())
          except exceptions.ClientRequestException as e:
              print(f"SWR CreateAuthorizationToken failed: {e.status_code} {e.error_code} {e.error_msg}",
                    file=sys.stderr)
              sys.exit(1)

          # Preferred: body {"auths": {"<host>": {"auth": base64("user:password")}}}
          auths = (resp.to_dict() or {}).get("auths") or {}
          for info in auths.values():
              if info and info.get("auth"):
                  print(info["auth"]); sys.exit(0)

          # Fallback: X-Swr-Dockerlogin header "docker login -u USER -p PASS [host]"
          cmd = getattr(resp, "x_swr_dockerlogin", None) or ""
          parts = cmd.split()
          if "-u" in parts and "-p" in parts:
              user = parts[parts.index("-u") + 1]; pwd = parts[parts.index("-p") + 1]
              print(base64.b64encode(f"{user}:{pwd}".encode()).decode()); sys.exit(0)

          print("SWR returned no login credentials", file=sys.stderr); sys.exit(1)
          PY
          )
          echo "::add-mask::${AUTH}"
          CRED=$(printf '%s' "$AUTH" | base64 -d)
          SWR_USER="${CRED%%:*}"; SWR_PASS="${CRED#*:}"
          echo "::add-mask::${SWR_PASS}"
          echo "SWR login user type: ${SWR_USER%%@*}"
          printf '%s' "${SWR_PASS}" | docker login -u "${SWR_USER}" --password-stdin "${SWR_HOST}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE_APP2}:${GITHUB_SHA}"
          docker push "${IMAGE_APP2}:latest"

      # ---- Stage 4: deploy to CCE ----
      # Step 4a: ask CCE for a short-lived kubeconfig (1 day), using the same
      # temporary OIDC credentials. GitHub runners are on the internet, so the
      # cluster's API server must have a public EIP ("external" context).
      - name: Get CCE kubeconfig (temporary)
        run: |
          set -euo pipefail
          [ -n "${HW_CLUSTER_ID}" ] || { echo "MISSING VARIABLE: HW_CLUSTER_ID"; exit 1; }
          KUBECONFIG_FILE="${RUNNER_TEMP}/kubeconfig"
          /tmp/hwsdk/bin/python - "$KUBECONFIG_FILE" <<'PY'
          import json, os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkcore.exceptions import exceptions
          from huaweicloudsdkcore.utils.http_utils import sanitize_for_serialization
          from huaweicloudsdkcce.v3 import CceClient, CreateKubernetesClusterCertRequest, CertDuration

          region = os.environ["HW_REGION"]
          cred = (BasicCredentials(os.environ["HW_ACCESS_KEY"], os.environ["HW_SECRET_KEY"],
                                   os.environ["HW_PROJECT_ID"])
                  .with_security_token(os.environ["HW_SECURITY_TOKEN"]))
          client = (CceClient.new_builder()
                    .with_credentials(cred)
                    .with_endpoints([f"https://cce.{region}.myhuaweicloud.com"])
                    .build())
          try:
              resp = client.create_kubernetes_cluster_cert(CreateKubernetesClusterCertRequest(
                  cluster_id=os.environ["HW_CLUSTER_ID"], body=CertDuration(duration=1)))
          except exceptions.ClientRequestException as e:
              print(f"CCE kubeconfig request failed: {e.status_code} {e.error_code} {e.error_msg}",
                    file=sys.stderr)
              sys.exit(1)

          # Turn the SDK object back into a real kubeconfig (kubectl reads JSON too)
          kc = sanitize_for_serialization(resp)
          kc.pop("Port-ID", None)
          names = [c["name"] for c in kc.get("contexts", [])]
          print("Contexts in kubeconfig:", names)
          if "external" not in names:
              print("No 'external' context: bind an EIP to the cluster's API server "
                    "(CCE console > cluster > Connection Information).", file=sys.stderr)
              sys.exit(1)
          kc["current-context"] = "external"
          with open(sys.argv[1], "w") as f:
              json.dump(kc, f)
          os.chmod(sys.argv[1], 0o600)
          PY
          # $GITHUB_ENV only applies to LATER steps, so also export it for this one
          echo "KUBECONFIG=${KUBECONFIG_FILE}" >> "$GITHUB_ENV"
          export KUBECONFIG="${KUBECONFIG_FILE}"
          kubectl version --request-timeout=20s
          # Show which Kubernetes permissions the agency has in the app namespace.
          # Grant them in CCE console > cluster > Permissions (agency github-actions).
          echo "RBAC check in namespace ${K8S_NAMESPACE}:"
          OK=1
          for r in deployments services secrets ingresses.networking.k8s.io horizontalpodautoscalers.autoscaling; do
            for v in get create patch; do
              if kubectl auth can-i "$v" "$r" -n "${K8S_NAMESPACE}" >/dev/null 2>&1; then
                echo "  yes  $v $r"
              else
                echo "  NO   $v $r"; OK=0
              fi
            done
          done
          [ "$OK" = 1 ] || { echo "The agency lacks Kubernetes permissions in namespace ${K8S_NAMESPACE}."; exit 1; }

      # Step 4b: deploy BOTH apps behind ONE ELB, with zero downtime for demo-api.
      #  1. app2 + the internal (NodePort) Services are applied first.
      #  2. The Ingress (k8s/ingress.yaml) takes the ELB's port-80 listener and
      #     routes /app2/... -> app2 and everything else -> demo-api.
      #     (First run only: demo-api's Service used to own that listener as a
      #     LoadBalancer Service, so we wait for CCE to release it before the
      #     Ingress claims it. Expect a short gap on that first run only.)
      #  3. We check through the ELB that both apps answer on their paths.
      #  4. demo-api is rolled out with maxSurge 1 / maxUnavailable 0 (new pod
      #     first, old pod stopped only when the new one is healthy), while a
      #     probe calls the public health URL every second to prove no downtime.
      #     If the new pod never becomes healthy, we roll back.
      - name: Deploy to CCE (two apps, one ELB, zero-downtime rolling update)
        run: |
          set -euo pipefail
          [ -n "${HW_ELB_ID}" ] || { echo "MISSING VARIABLE: HW_ELB_ID"; exit 1; }
          NS="${K8S_NAMESPACE}"

          # Creating a namespace is a cluster-wide right; only do it if we have it.
          if kubectl auth can-i create namespaces >/dev/null 2>&1; then
            kubectl apply -f k8s/namespace.yaml
          else
            echo "No cluster-wide namespace rights; assuming namespace ${NS} already exists."
          fi

          # CCE creates "default-secret" (SWR pull secret) in new namespaces; wait for it
          for i in $(seq 1 12); do
            kubectl -n "${NS}" get secret default-secret >/dev/null 2>&1 && break
            echo "Waiting for default-secret in ${NS}..."; sleep 5
          done

          # Fill in the placeholders
          mkdir -p "${RUNNER_TEMP}/k8s"
          for f in deployment.yaml service.yaml app2.yaml ingress.yaml; do
            sed -e "s|__IMAGE__|${IMAGE}:${GITHUB_SHA}|g" \
                -e "s|__IMAGE_APP2__|${IMAGE_APP2}:${GITHUB_SHA}|g" \
                -e "s|__ELB_ID__|${HW_ELB_ID}|g" "k8s/$f" > "${RUNNER_TEMP}/k8s/$f"
          done

          # Public (non-private) IPs from a Service's or Ingress's load-balancer status
          public_ip() {
            kubectl -n "${NS}" get "$1" -o jsonpath='{range .status.loadBalancer.ingress[*]}{.ip}{"\n"}{end}' 2>/dev/null \
              | grep -vE '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' | head -n 1 || true
          }
          # Print why pods are not running (scheduler / probe messages + recent events)
          diag() {
            kubectl -n "${NS}" get pods -o wide || true
            echo "Why each pod is not scheduled / not ready:"
            kubectl -n "${NS}" get pods -o \
              jsonpath='{range .items[*]}{.metadata.name}{": "}{range .status.conditions[?(@.status=="False")]}{.type}{" -> "}{.message}{"  "}{end}{"\n"}{end}' || true
            kubectl -n "${NS}" get events --sort-by=.lastTimestamp 2>&1 | tail -15 || true
          }

          # Remember the ELB's public IP while demo-api's Service may still own it (first run)
          ELB_PUBLIC_IP="$(public_ip "svc/${APP_NAME}")"

          # ---- 1. app2 and the internal Services ----
          # One-time migration: CCE refuses to detach an existing Service from its ELB
          # ("can't modify service elb annotation"), so if demo-api's Service is still a
          # LoadBalancer we delete it and recreate it as an internal NodePort Service.
          # The ELB itself is kept (it was created in the console and is referenced by ID);
          # only its port-80 listener is removed, and the Ingress recreates it below.
          if [ "$(kubectl -n "${NS}" get svc "${APP_NAME}" -o jsonpath='{.spec.type}' 2>/dev/null)" = "LoadBalancer" ]; then
            echo "One-time migration: replacing the LoadBalancer Service ${APP_NAME} with a NodePort Service"
            kubectl -n "${NS}" delete svc "${APP_NAME}" --wait=true
          fi
          kubectl apply -f "${RUNNER_TEMP}/k8s/service.yaml" -f "${RUNNER_TEMP}/k8s/app2.yaml"
          if ! kubectl -n "${NS}" rollout status deployment/app2 --timeout=10m; then
            echo "app2 did not become ready:"; diag
            kubectl -n "${NS}" rollout undo deployment/app2 || true
            exit 1
          fi

          # ---- 2. Ingress takes over the ELB's port-80 listener ----
          # Wait until demo-api's Service no longer holds the ELB (only matters on the first run)
          for i in $(seq 1 24); do
            [ -z "$(kubectl -n "${NS}" get svc "${APP_NAME}" -o jsonpath='{.status.loadBalancer.ingress}' 2>/dev/null)" ] && break
            echo "Waiting for CCE to release the ELB listener from the demo-api Service..."; sleep 5
          done
          kubectl apply -f "${RUNNER_TEMP}/k8s/ingress.yaml"
          for i in $(seq 1 36); do
            IP="$(public_ip ingress/apps)"
            [ -n "$IP" ] && { ELB_PUBLIC_IP="$IP"; break; }
            [ -n "$(kubectl -n "${NS}" get ingress apps -o jsonpath='{.status.loadBalancer.ingress}' 2>/dev/null)" ] && break
            echo "Waiting for the Ingress to be attached to the ELB..."; sleep 5
          done
          kubectl -n "${NS}" get ingress apps -o wide || true
          # The Ingress status only shows the ELB's PRIVATE IP, so ask the ELB API for its public EIP
          if [ -z "${ELB_PUBLIC_IP}" ]; then
            ELB_PUBLIC_IP="$(/tmp/hwsdk/bin/python - <<'PY' || true
          import os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkelb.v3 import ElbClient, ShowLoadBalancerRequest
          cred = (BasicCredentials(os.environ["HW_ACCESS_KEY"], os.environ["HW_SECRET_KEY"],
                                   os.environ["HW_PROJECT_ID"])
                  .with_security_token(os.environ["HW_SECURITY_TOKEN"]))
          client = (ElbClient.new_builder().with_credentials(cred)
                    .with_endpoints([f"https://elb.{os.environ['HW_REGION']}.myhuaweicloud.com"]).build())
          try:
              lb = client.show_load_balancer(ShowLoadBalancerRequest(loadbalancer_id=os.environ["HW_ELB_ID"])).loadbalancer
          except Exception as e:
              print(f"ELB lookup failed: {e}", file=sys.stderr); sys.exit(1)
          ips = [e.eip_address for e in (lb.eips or []) if e.eip_address] + \
                [p.publicip_address for p in (lb.publicips or []) if p.publicip_address]
          if ips: print(ips[0])
          PY
            )"
          fi
          [ -n "${ELB_PUBLIC_IP}" ] || { echo "::error::Could not find the ELB's public IP (does the ELB have an EIP, and may the agency read ELB?)"; kubectl -n "${NS}" describe ingress apps | tail -20; exit 1; }
          echo "ELB public IP: ${ELB_PUBLIC_IP}"

          # ---- 3. Both apps must answer through the SAME ELB ----
          check() {   # check <path> <text expected in the body>
            for i in $(seq 1 24); do
              BODY="$(curl -s -m 5 -w ' HTTP%{http_code}' "http://${ELB_PUBLIC_IP}$1" || true)"
              if [[ "$BODY" == *"HTTP200"* && "$BODY" == *"$2"* ]]; then
                echo "  OK  http://${ELB_PUBLIC_IP}$1 -> ${BODY}"; return 0
              fi
              sleep 5
            done
            echo "  FAIL http://${ELB_PUBLIC_IP}$1 -> ${BODY}"; return 1
          }
          echo "Routing check through the ELB:"
          ROUTING_OK=1
          check /actuator/health '"status":"UP"' || ROUTING_OK=0
          check /app2/hello '"app":"app2"' || ROUTING_OK=0
          if [ "$ROUTING_OK" = 0 ]; then
            kubectl -n "${NS}" describe ingress apps | tail -25 || true
            echo "::error::The Ingress is not routing both apps through the ELB."; exit 1
          fi

          # ---- 4. Zero-downtime rollout of demo-api ----
          PROBE_LOG="${RUNNER_TEMP}/probe.log"; : > "$PROBE_LOG"
          echo "Probing http://${ELB_PUBLIC_IP}/actuator/health during the rollout"
          ( while true; do
              curl -s -o /dev/null -m 3 -w '%{http_code}\n' "http://${ELB_PUBLIC_IP}/actuator/health" >> "$PROBE_LOG" || echo "000" >> "$PROBE_LOG"
              sleep 1
            done ) &
          PROBE_PID=$!
          stop_probe() {
            kill "$PROBE_PID" 2>/dev/null || true
            TOTAL=$(wc -l < "$PROBE_LOG" | tr -d ' ')
            FAILED=$(grep -vc '^200$' "$PROBE_LOG" || true)
            echo "Downtime probe: ${TOTAL} requests, ${FAILED} failed"
            if [ "${FAILED:-0}" -gt 0 ]; then
              echo "::warning::${FAILED} of ${TOTAL} health requests failed during the deploy"
            fi
          }

          kubectl apply -f "${RUNNER_TEMP}/k8s/deployment.yaml"
          # HPA: lets Kubernetes run 1-3 demo-api pods depending on CPU load
          kubectl apply -f k8s/hpa.yaml
          # 10 minutes: if the new pod doesn't fit, the node pool's auto scaling
          # adds a node first (that takes ~3-6 minutes) before the pod can start.
          if ! kubectl -n "${NS}" rollout status "deployment/${APP_NAME}" --timeout=10m; then
            echo "Rollout failed:"; diag
            # The old pod was never stopped (maxUnavailable 0): undo just removes the stuck new pod.
            echo "Rolling back demo-api to the previous version..."
            kubectl -n "${NS}" rollout undo "deployment/${APP_NAME}" || true
            kubectl -n "${NS}" rollout status "deployment/${APP_NAME}" --timeout=3m || true
            stop_probe
            echo "::error::New demo-api version did not become healthy; rolled back. The previous version is still serving (app2 and the Ingress are deployed)."
            exit 1
          fi
          sleep 15   # let the old pod drain (preStop 10s) before stopping the probe
          stop_probe
          kubectl -n "${NS}" get deploy,pods,svc,ingress -o wide
          # HPA status. TARGETS "<unknown>" means the Metrics Server add-on is missing,
          # so the HPA can't read CPU yet (install "Kubernetes Metrics Server" in CCE Add-ons).
          kubectl -n "${NS}" get hpa "${APP_NAME}" || true
          if kubectl -n "${NS}" get hpa "${APP_NAME}" -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}' 2>/dev/null | grep -q False; then
            echo "::warning::HPA cannot read CPU metrics yet. Install the 'Kubernetes Metrics Server' add-on in CCE."
          fi
          echo "Deployed ${IMAGE}:${GITHUB_SHA} and ${IMAGE_APP2}:${GITHUB_SHA} behind ELB ${ELB_PUBLIC_IP}"
