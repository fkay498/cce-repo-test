# app2 answers in two ways:
#   - path-based:  http://<ELB or API Gateway>/app2/...   (Ingress path /app2)
#   - host-based:  http://app2.qucoon.cloud/...            (Ingress host rule, path /)
server {
    listen 8080;
    default_type application/json;

    # Health check (Kubernetes probes use /app2/health; /health is for the host name)
    location = /app2/health {
        return 200 '{"app":"app2","status":"UP"}\n';
    }
    location = /health {
        return 200 '{"app":"app2","status":"UP"}\n';
    }

    # Any other URL: say hello and show which pod answered
    location / {
        return 200 '{"app":"app2","message":"Hello from the second app","pod":"$hostname","path":"$request_uri"}\n';
    }
}
