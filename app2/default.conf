# All of app2 lives under /app2, because the Ingress sends /app2/... here.
server {
    listen 8080;

    # Health check used by Kubernetes (startup/readiness/liveness probes)
    location = /app2/health {
        default_type application/json;
        return 200 '{"app":"app2","status":"UP"}\n';
    }

    # Any other /app2 URL: say hello and show which pod answered
    location /app2 {
        default_type application/json;
        return 200 '{"app":"app2","message":"Hello from the second app","pod":"$hostname","path":"$request_uri"}\n';
    }

    location / {
        return 404;
    }
}
